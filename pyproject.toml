[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project]
name = "smart-goals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "optuna",
    "scipy",
    "seaborn",
    "snowflake-snowpark-python[pandas]",
    "statsmodels",
    "mlflow-skinny<3",
    "ray[data,train,tune,serve]>=2.53.0",
    "category-encoders>=2.9.0",
    "shap>=0.49.1",
    "scikit-learn>=1.7.2",
    "lightgbm>=4.6.0",
    "pyarrow>=18.1.0",
]

[dependency-groups]
dev = [
    "quarto-cli>=1.8.27",
    "ruff>=0.15.1",
    "ty>=0.0.17",
    "pytest>=8.4.0",
    "onnxruntime>=1.22.0",
    "snowflake-ml-python>=1.29.0",
    "skl2onnx>=1.20.0",
    "onnxmltools>=1.14.0",
    "go-task-bin>=3.48.0",
]
